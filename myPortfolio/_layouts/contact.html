<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | Antoine Allard</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        .kitchen-bg {
            background: url('{{ page.background_image | relative_url }}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 50px; background-color: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px); position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
        }
        nav a { color: #333; text-decoration: none; margin-left: 20px; font-weight: bold; }
        a:hover {color: #9c0000;}

        /* Conteneur Formulaire + Infos */
        .contact-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            width: 700px;
            display: flex;
            gap: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            border: 1px solid white;
        }

        /* Section Infos (Email & Réseaux) */
        .contact-info { width: 40%; border-right: 1px solid #ddd; padding-right: 20px; }
        .contact-info h2 { color: #2ecc71; margin-top: 0; font-size: 1.5rem; }
        .info-item { margin-bottom: 20px; }
        .info-item label { display: block; font-size: 0.7rem; font-weight: bold; color: #777; text-transform: uppercase; }
        .info-item a, .info-item p { color: #ff0000; text-decoration: none; font-size: 0.95rem; margin: 5px 0; word-break: break-all; }
        .info-item a:hover { color: #2ecc71; text-decoration: underline; }

        /* Section Formulaire */
        .contact-form { width: 60%; }
        input, textarea {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
            background: #f9f9f9; font-family: inherit;
        }

        button {
            width: 100%; padding: 15px; background: #2ecc71; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; 
            font-size: 1rem; transition: background 0.3s;
        }
        button:hover { background: #27ae60; }

        .social-icons { margin-top: 20px; display: flex; gap: 15px; }
        .social-btn { 
            background: #333; color: white; padding: 8px 12px; 
            border-radius: 5px; text-decoration: none; font-size: 0.8rem;
        }
        .social-btn:hover { background: #000; }
    </style>
</head>
<body>

    <nav>
        <div style="color:#333">ANTOINE ALLARD</div>
        <div>
            <a href="/">Accueil</a>
            <a href="/about">À propos</a>
            <a href="/projects">Projets</a>
            <a href="/contact">Contact</a>
        </div>
    </nav>

    <div class="kitchen-bg">
        <div class="contact-card">
            
            <div class="contact-info">
                <h2>Contact</h2>
                <div class="info-item">
                    <label>Email Professionnel</label>
                    <p>{{ page.email }}</p>
                </div>
                
                <div class="info-item">
                    <label>Retrouvez-moi sur</label>
                    <div class="social-icons">
                        <a href="{{ page.linkedin_url }}" target="_blank" class="social-btn">LinkedIn</a>
                        <a href="{{ page.github_url }}" target="_blank" class="social-btn">GitHub</a>
                    </div>
                </div>
                <p style="font-size: 0.8rem; color: #888; margin-top: 40px;">
                    N'hésitez pas à m'envoyer un message pour toute proposition de collaboration.
                </p>
            </div>

            <form class="contact-form">
                <input type="text" placeholder="Nom complet" required>
                <input type="email" placeholder="Adresse Email" required>
                <input type="text" placeholder="Sujet">
                <textarea rows="6" placeholder="Votre message..." required></textarea>
                <button type="button" onclick="alert('Message simulé ! (Formulaire statique)')">ENVOYER</button>
            </form>

        </div>
    </div>

</body>
</html>
