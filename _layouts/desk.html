<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            background-color: #1a1c2c; 
        }
        
        .desk-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .desk-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('{{ page.background_image | relative_url }}') no-repeat center center fixed;
            background-size: cover;
            filter: blur(5px);
            transform: scale(1.05);
            z-index: 1;
        }

        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 15px 50px; 
            background-color: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav a { color: #ffffff; text-decoration: none; margin-left: 20px; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: #2ecc71; }

        .name { font-weight: bold; font-size: 1rem; color: #ffffff; letter-spacing: 1px; }

        .computer-monitor {
            position: relative;
            z-index: 2;
            width: 700px;
            height: 450px;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #333;
            border-radius: 12px;
            display: flex;
            padding: 20px;
            padding-top: 10px;
            color: #2ecc71; 
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(46, 204, 113, 0.15); 
            backdrop-filter: blur(8px);
        }

        .sidebar { width: 35%; border-right: 1px solid #2ecc71; padding-right: 15px; overflow-y: auto; }
        .display { width: 65%; padding-left: 20px; overflow-y: auto; font-size: 0.85rem; }

        .item { 
            cursor: pointer; 
            padding: 10px; 
            margin: 8px 0; 
            border: 1px solid #2ecc71; 
            font-size: 0.8rem; 
            transition: all 0.3s;
        }
        .item:hover { 
            background: rgba(46, 204, 113, 0.2); 
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
            transform: translateX(5px);
        }
        
        .btn-link { 
            color: #000; 
            background: #2ecc71; 
            padding: 8px; 
            text-decoration: none; 
            display: inline-block; 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 0.75rem; 
            margin-right: 10px; 
            transition: 0.3s;
        }
        .btn-link:hover { background: #fff; box-shadow: 0 0 10px #fff; }

        .term-label { color: #fff; font-weight: bold; display: block; margin-top: 10px; text-decoration: underline; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #2ecc71; }

        @media (max-width: 768px) {
            .computer-monitor { width: 95%; height: 80vh; flex-direction: column; }
            .sidebar { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid #2ecc71; padding-bottom: 10px; }
            .display { width: 100%; padding-left: 0; padding-top: 10px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="name">ANTOINE ALLARD</div>
        <div class="nav-links">
            <a href="../">Accueil</a>
            <a href="../about">À propos</a>
            <a href="../projects">Projets</a>
            <a href="../contact">Contact</a>
        </div>
    </nav>

    <div class="desk-container">
        <div class="computer-monitor">
            <div class="sidebar">
                <h3>./PROJETS_LIST</h3>
                {% for p in site.projects %}
                <div class="item" 
                     data-title="{{ p.title | escape }}"
                     data-context="{{ p.context | escape }}"
                     data-objective="{{ p.objective | escape }}"
                     data-technos="{{ p.technos | escape }}"
                     data-repo="{{ p.github_repo }}"
                     data-live="{{ p.github_pages | default: '' }}"
                     onclick="updateFromData(this)">
                    > {{ p.title }}
                </div>
                {% endfor %}
            </div>

            <div class="display" id="screen">
                <h3>TERMINAL_READY</h3>
                <p>Initialisation du système...</p>
                <p>> Choisissez un projet à gauche pour consulter les archives techniques.</p>
            </div>
        </div>
    </div>

    <script>
        function updateFromData(element) 
        {
            // Récupération des données via les attributs HTML
            const title = element.getAttribute('data-title');
            const context = element.getAttribute('data-context');
            const objective = element.getAttribute('data-objective');
            const technos = element.getAttribute('data-technos');
            const repo = element.getAttribute('data-repo');
            const live = element.getAttribute('data-live');

            let liveButton = "";
            // Condition : si le lien live existe et n'est pas vide
            if (live && live.trim() !== "" && live !== "nil") 
            {
                liveButton = `<a href="${live}" target="_blank" class="btn-link">[ DEMO_LIVE ]</a>`;
            }

            document.getElementById('screen').innerHTML = `
                <h3>PROJET: ${title}</h3>
                
                <span class="term-label">CONTEXTE :</span>
                <span>${context}</span>

                <span class="term-label">OBJECTIF :</span>
                <span>${objective}</span>

                <span class="term-label">TECHNOLOGIES :</span>
                <span style="color: #3498db;">${technos}</span>

                <div style="margin-top: 20px; border-top: 1px dashed #2ecc71; padding-top: 10px;">
                    <a href="${repo}" target="_blank" class="btn-link">[ CODE_SOURCE ]</a>
                    ${liveButton}
                </div>
            `;
        }
    </script>

</body>
</html>
