<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .desk-container {
            background: #1a1c2c url('{{ page.background_image | relative_url }}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 50px; background-color: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px); position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
        }
        nav a { color: #ffffff; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover { color: #9c0000; }

        .name { font-weight: bold; font-size: 1rem; color: #ffffff; }

        .computer-monitor {
            width: 700px;
            height: 450px;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #333;
            border-radius: 10px;
            display: flex;
            padding: 20px;
            padding-top: 10px;
            color: #2ecc71; 
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        .sidebar { width: 35%; border-right: 1px solid #2ecc71; padding-right: 15px; overflow-y: auto; }
        .display { width: 65%; padding-left: 20px; overflow-y: auto; font-size: 0.85rem; }

        .item { 
            cursor: pointer; padding: 10px; margin: 8px 0; border: 1px solid #2ecc71; 
            font-size: 0.8rem; transition: 0.3s;
        }
        .item:hover { background: rgba(46, 204, 113, 0.2); }
        
        .btn-link { color: #000; background: #2ecc71; padding: 8px; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; font-size: 0.75rem; margin-right: 10px; }
        .btn-link:hover { background: #fff; }

        .term-label { color: #fff; font-weight: bold; display: block; margin-top: 10px; text-decoration: underline; }
    </style>
</head>
<body>

    <nav>
        <div class="name">ANTOINE ALLARD</div>
        <div>
            <a href="home">Accueil</a>
            <a href="about">À propos</a>
            <a href="projects">Projets</a>
            <a href="contact">Contact</a>
        </div>
    </nav>

    <div class="desk-container">
        <div class="computer-monitor">
            <div class="sidebar">
                <h3>./PROJETS_LIST</h3>
                {% for p in site.projects %}
                <div class="item" onclick="update('{{ p.title | escape }}', '{{ p.context | escape }}', '{{ p.objective | escape }}', '{{ p.technos | escape }}', '{{ p.github_repo }}', '{{ p.github_pages }}')">
                    > {{ p.title }}
                </div>
                {% endfor %}
            </div>

            <div class="display" id="screen">
                <h3>TERMINAL_READY</h3>
                <p>Initialisation du système...</p>
                <p>> Choisissez un projet à gauche pour consulter les archives techniques.</p>
            </div>
        </div>
    </div>

    <script>
        function update(title, context, objective, technos, repo, live) {
            document.getElementById('screen').innerHTML = `
                <h3>PROJET: ${title}</h3>
                
                <span class="term-label">CONTEXTE :</span>
                <span>${context}</span>

                <span class="term-label">OBJECTIF :</span>
                <span>${objective}</span>

                <span class="term-label">TECHNOLOGIES :</span>
                <span style="color: #3498db;">${technos}</span>

                <div style="margin-top: 20px; border-top: 1px dashed #2ecc71; padding-top: 10px;">
                    <a href="${repo}" target="_blank" class="btn-link">[ CODE_SOURCE ]</a>
                    <a href="${live}" target="_blank" class="btn-link">[ DEMO_LIVE ]</a>
                </div>
            `;
        }
    </script>

</body>
</html>
